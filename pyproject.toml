[project]
name = "trion"
version = "0.1.0"
description = "Open-source framework for AI agents whose behavior is predictable, auditable, and safe by design — rules live in transparent configuration, not in code."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Dennis", email = "trlon.devs.dk@gmail.com" }]
keywords = ["ai", "agents", "mcp", "llm", "framework", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "httpx>=0.26.0,<1.0.0",
    "socksio>=1.0.0,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "docker>=7.0.0,<8.0.0",
    "cryptography>=41.0.0,<43.0.0",
    "websockets>=12.0,<14.0",
    "jsonschema>=4.18.5,<5.0.0",
    "referencing>=0.28.4,<1.0.0",
    "fastmcp",
]

[project.urls]
Homepage = "https://github.com/danny094/TRION-system"
Documentation = "https://github.com/danny094/TRION-system/blob/main/docs/architecture.md"

# TRION is not yet packaged as an installable wheel — the supported way to run it
# is the Docker stack (see README Quickstart). This file provides project metadata,
# dependency groups for CI, and the pytest configuration.

[dependency-groups]
test = [
    { include-group = "runtime" },
    "pytest>=8.0",
]
runtime = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "httpx>=0.26.0,<1.0.0",
    "socksio>=1.0.0,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "docker>=7.0.0,<8.0.0",
    "cryptography>=41.0.0,<43.0.0",
    "websockets>=12.0,<14.0",
    "jsonschema>=4.18.5,<5.0.0",
    "referencing>=0.28.4,<1.0.0",
    "fastmcp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Known target-behavior tests at this public snapshot. These ten contracts are
# deliberately excluded and disclosed in the README; all other collected tests
# must pass.
addopts = [
    "--deselect=tests/test_documententest_execution.py::test_documententest_semantic_question_runs_through_runner_with_search_first",
    "--deselect=tests/test_documententest_execution.py::test_documententest_semantic_question_executes_search_then_read_via_task_loop",
    "--deselect=tests/test_documententest_execution.py::test_documententest_semantic_hits_drive_workspace_reads",
    "--deselect=tests/test_p10_1_backend_smoke.py::test_backend_forbidden_direct_is_filtered_before_planning_and_replan",
    "--deselect=tests/test_p10_1_backend_smoke.py::test_backend_task_loop_replanner_receives_orchestrator_context",
    "--deselect=tests/test_p10_1_backend_smoke.py::test_backend_home_synonym_builds_container_inspect_args",
    "--deselect=tests/test_p10_1_backend_smoke.py::test_backend_truth_reasoning_replans_to_workspace_get_after_time_result",
    "--deselect=tests/test_plan_contract_validator_metadata.py::test_empty_required_args_is_allowed",
    "--deselect=tests/test_plan_contract_validator_metadata.py::test_mismatching_complete_values_are_not_re_evaluated",
    "--deselect=tests/test_truth_reasoning_capabilities.py::test_analyzer_resolves_file_capability_from_live_tool_details",
]
