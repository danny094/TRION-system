      <stop offset="100%" stop-color="#070410"/>
    </linearGradient>
    <style>
      .pulse-p { animation: glowP 3.5s ease-in-out infinite alternate; }
      .pulse-g { animation: glowG 3.5s ease-in-out infinite alternate; }
      @keyframes glowP {
        from { stroke-opacity: 0.5; }
        to   { stroke-opacity: 1; filter: drop-shadow(0 0 8px rgba(168,85,247,0.6)); }
      }
      @keyframes glowG {
        from { stroke-opacity: 0.35; }
        to   { stroke-opacity: 0.9; filter: drop-shadow(0 0 8px rgba(74,222,128,0.45)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-p, .pulse-g { animation: none; }
      }
      text { font-family: system-ui, sans-serif; }
      .mono { font-family: ui-monospace, monospace; }
    </style>
